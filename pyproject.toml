[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "covariance-shrinkage-research"
version = "0.1.0"
description = "An auditable simulation subset of Ledoit and Wolf (2004) covariance shrinkage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scikit-learn>=1.4,<2", "build>=1.2,<2"]

[project.scripts]
shrinkage-research = "shrinkage_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
