[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "covariance-shrinkage-research"
version = "2.0.0"
description = "Auditable CSV portfolio risk analysis and covariance-shrinkage research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scikit-learn>=1.4,<2", "build>=1.2,<2"]
app = ["streamlit>=1.40,<2"]

[project.scripts]
shrinkage-research = "shrinkage_research.cli:main"
shrinkage-risk = "shrinkage_research.risk_cli:main"
shrinkage-risk-ui = "shrinkage_research.risk_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
