name: Numerical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: python -m build

  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Run the fixed protocol
        run: shrinkage-research --config configs/paper_subset.json --out work/ci-run
      - name: Preserve outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: work/ci-run/
          if-no-files-found: warn
